name: build

on:
  # Branches build once, through their pull request; a push runs only for master and tags.
  # While the repository is private (no Actions minutes), pushes to master build nothing; tags and manual runs still do.
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # also builds the release packages
    inputs:
      platforms:
        description: "Which platforms' jobs run (all, or one: macos, linux, windows (with PC VR), android (with Meta Quest))"
        default: all
        type: choice
        options: [all, macos, linux, windows, android]
      release_tag:
        description: "Make the draft release for this tag, as a v* tag push does (empty: no release; a test name like v0.1.0-citest)"
        default: ''
        type: string

# A newer run of the same branch or tag cancels the one still running (Windows minutes count double).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Desktop: build the app, gt4tool and the unit tests on macOS, Linux and Windows and run the
# tests that need no disc image (the tests that read game data skip without GT4R_DISC).
# Android: build the debug APK (arm64-v8a + x86_64) with the pinned NDK.
#
# Needs: GitHub's hosted runners only. Secrets: only the release APKs' signing key (jobs
# package-android and package-quest: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD; docs/BUILDING.md "Making a
# release"). The engine is the engine/gt3r submodule, fetched from its public repository, so the
# submodule commit must be pushed there. SDL 3.4.12, zlib and libchdr are fetched by CMake
# (engine/gt3r/cmake/Dependencies.cmake). Shaders are the engine's committed ones, so no shader
# tools are needed.
#
# Release packages (job `package`, on tags v* and manual runs) build SDL from source so they run
# without a system SDL, and hold no game data (cmake/Packaging.cmake). tools/release/package.sh
# makes the same macOS and Linux packages on a computer.
#
# Making a release (docs/BUILDING.md, "Making a release"): push the tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# Job `draft` creates a draft GitHub Release for the tag (or reuses that tag's draft), each
# `package` job uploads its file to it under a stable name (gt4r-macos-arm64.zip,
# gt4r-linux-x86_64.tar.gz, gt4r-windows-x64.zip, gt4r-windows-x64-vr.zip, job `package-android` gt4r-android.apk and
# job `package-quest` gt4r-quest.apk: .../releases/latest/download/<name> always fetches the newest), and job `release` adds SHA256SUMS
# of the uploaded files. Then review the draft on the Releases page and publish it. A release run
# stores nothing in Actions storage (no upload-artifact / download-artifact): release assets don't
# count against it. Build provenance attestations need a public repository: they are made only
# when the repository is public, and re-running job `release` after the repository is made public
# attests the files already there.
# A manual run with release_tag set (gh workflow run build.yml --ref <branch> -f
# release_tag=v0.1.0-citest) runs the same path into a draft of that name, without a git tag;
# delete that draft afterwards (gh release delete v0.1.0-citest).

jobs:
  desktop:
    if: (github.event_name != 'push' || !github.event.repository.private) && (github.event_name != 'workflow_dispatch' || inputs.platforms != 'android')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'windows' && '["windows-2022"]' || inputs.platforms == 'macos' && '["macos-15"]' || inputs.platforms == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2022", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libxkbcommon-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build app, tools and tests
        run: cmake --build build --config Release --parallel 4 --target gt4r gt4tool gt4r_tests
      - name: Unit tests (no disc image)
        run: ctest --test-dir build -C Release --output-on-failure --verbose # (the tests run, skipped and failed, at the end)

  # Android (android/README.md): the debug APK (arm64-v8a + x86_64) with the pinned NDK, as an artifact. Gradle's downloads
  # are kept in GRADLE_USER_HOME=.gradle-home in the workspace, cached from master (Maven Central answers busy CI addresses
  # with HTTP 429).
  android:
    if: (github.event_name != 'push' || !github.event.repository.private) && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'android')
    runs-on: ubuntu-24.04
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Gradle cache (restore)
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Fetch SDL
        run: android/fetch-sdl.sh
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      # Saved from master only: a pull request's cache would be visible to that pull request alone.
      - name: Gradle cache (save)
        if: github.ref == 'refs/heads/master' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true # (an APK for testing; skipped when the account's Actions storage is full)
        with:
          name: gt4r-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # ANGLE for the Windows package (packaging/angle.ps1, ~18 min), kept in the cache from master: a
  # tag's run restores only its own tag's caches and the default branch's. Built again when the
  # script or the triplets change; every other push just restores it, which also keeps it from
  # expiring (7 days unused).
  angle-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.repository.private
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: ANGLE (cached)
        id: angle
        uses: actions/cache@v4
        with:
          path: angle
          key: angle-windows-${{ hashFiles('packaging/angle.ps1', 'packaging/vcpkg-triplets/**') }}
      - name: ANGLE
        if: steps.angle.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/angle.ps1

  # A release run (a v* tag, or a manual run with release_tag): the draft release the package jobs
  # upload to, made once here so they don't race. A tag that already has a published release is
  # left alone (the run stops).
  draft:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the draft release
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          case "$TAG" in v*) ;; *) echo "::error::release tag '$TAG' does not start with v"; exit 1 ;; esac
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then echo "::error::$TAG already has a published release; nothing changed"; exit 1; fi
            echo "draft release $TAG exists: the packages go to it"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "GT4 Revisited $TAG"
          else
            # No git tag: publishing a draft creates its tag; a test draft is deleted unpublished.
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --generate-notes --title "GT4 Revisited $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  package:
    needs: [draft]
    if: >-
      !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'android'))
    strategy:
      fail-fast: false
      matrix:
        # macos-15 / macos-arm64, windows-2022 / windows-x64, ubuntu-22.04 / linux-x86_64 (older glibc: runs on more
        # distributions), and PC VR (docs/VR.md): windows-2022 / windows-x64-vr, the Windows build with GT3R_XR (SDL's
        # development branch, the OpenXR loader beside gt4r.exe); a manual run may take one platform.
        include: ${{ fromJSON(inputs.platforms == 'windows' && '[{"os":"windows-2022","name":"windows-x64"},{"os":"windows-2022","name":"windows-x64-vr","cmake":"-DGT3R_XR=ON"}]' || inputs.platforms == 'macos' && '[{"os":"macos-15","name":"macos-arm64"}]' || inputs.platforms == 'linux' && '[{"os":"ubuntu-22.04","name":"linux-x86_64"}]' || '[{"os":"macos-15","name":"macos-arm64"},{"os":"windows-2022","name":"windows-x64"},{"os":"windows-2022","name":"windows-x64-vr","cmake":"-DGT3R_XR=ON"},{"os":"ubuntu-22.04","name":"linux-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write     # upload to the draft release
      id-token: write     # sign this package's provenance attestation
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.draft.outputs.tag }} # (empty: not a release run)
    steps:
      # gt4r-<tag>-<platform> (the release tag, else the branch with '/' made '-': the name is a file's).
      - name: Package name
        shell: bash
        run: |
          name="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          echo "PKG=gt4r-${name//\//-}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libxkbcommon-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev zlib1g-dev g++-12
      # Windows: ANGLE (OpenGL ES on Direct3D 11) for the 3D renderer on GPUs without Vulkan
      # (packaging/angle.ps1); it ships next to gt4r.exe. Restored from the cache that job
      # angle-cache keeps, built here when the cache has none.
      - name: ANGLE (Windows, cached)
        id: angle
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: angle
          key: angle-windows-${{ hashFiles('packaging/angle.ps1', 'packaging/vcpkg-triplets/**') }}
      - name: ANGLE (Windows)
        if: runner.os == 'Windows' && steps.angle.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/angle.ps1
      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then extra="-DGT3R_SDL_SHARED=ON -DGT3R_ANGLE_DIR=$GITHUB_WORKSPACE/angle"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DGT4R_MAC_BUNDLE=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=arm64"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then extra="-DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGT3R_FETCH_SDL=ON -DGT4R_BUILD_TESTS=OFF $extra ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target gt4r gt4tool
      - name: Install
        run: cmake --install build --config Release --prefix "dist/${{ env.PKG }}"
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "dist/$PKG/gt4r.app"
          ditto -c -k --keepParent "dist/$PKG" "$PKG.zip"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The PC VR package must carry the OpenXR loader: without it the game opens its window, never the headset.
          if ("${{ matrix.name }}" -eq "windows-x64-vr" -and -not (Test-Path "dist/$env:PKG/openxr_loader.dll")) { throw "no openxr_loader.dll in the VR package" }
          Compress-Archive -Path "dist/$env:PKG" -DestinationPath "$env:PKG.zip"
          Get-ChildItem -Recurse -File "dist/$env:PKG" | ForEach-Object { Write-Host "  $($_.FullName.Substring((Resolve-Path dist).Path.Length + 1)) $($_.Length)" }
          Write-Host "$env:PKG.zip $((Get-Item "$env:PKG.zip").Length) bytes, SHA256 $((Get-FileHash "$env:PKG.zip" -Algorithm SHA256).Hash.ToLower())"
      # The packaged game started from its archive with no disc, muted, with a data folder of its own: a scripted run
      # (--shot) shows no window and saves a picture of the disc-choice page. Runners have no GPU with Vulkan: the
      # 3D renderer is ANGLE's OpenGL ES on Direct3D 11's software adapter. The PC VR package too: with no OpenXR
      # runtime on the runner it starts as the window does.
      - name: Smoke run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force "$d\data" | Out-Null
          Expand-Archive "$env:PKG.zip" $d
          $env:GT4R_DATA_DIR = "$d\data"; $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process "$d\$env:PKG\gt4r.exe" -ArgumentList "--shot", "$d\no-disc.png", "--shot-frame", "60" -PassThru
          $null = $p.Handle # (keeps the exit code readable)
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Host "still running after 3 minutes" }
          Write-Host "exit code: $($p.ExitCode)"
          Get-ChildItem -Recurse "$d\data" | ForEach-Object { Write-Host "  $($_.FullName)" }
          Get-ChildItem "$d\data\*.log" | ForEach-Object { Get-Content $_ }
          if (-not (Test-Path "$d\no-disc.png")) { throw "no picture" }
          Copy-Item "$d\no-disc.png" "smoke-$env:PKG.png"
          # Manual runs: the picture in the log too (base64 between the marks), for when artifacts can't be stored.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "---- smoke picture (base64) ----"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes("$d\no-disc.png")) -split '(.{1,4000})' | Where-Object { $_ } | ForEach-Object { Write-Host $_ }
            Write-Host "---- end ----"
          }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && env.RELEASE_TAG == ''
        continue-on-error: true # (the picture alone)
        with:
          name: smoke-${{ env.PKG }}
          path: smoke-${{ env.PKG }}.png
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "$PKG.tar.gz" "$PKG"
      # Attested where it was built. Release runs on a public repository only (attestations need one).
      - uses: actions/attest-build-provenance@v2
        if: env.RELEASE_TAG != '' && github.event.repository.private == false
        with:
          subject-path: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}.tar.gz
      # Release runs: straight to the draft release, under the stable name gt4r-<platform>.<ext>.
      - name: Upload to the draft release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ext=zip; if [ "$RUNNER_OS" = Linux ]; then ext=tar.gz; fi
          cp "$PKG.$ext" "gt4r-${{ matrix.name }}.$ext"
          gh release upload "$RELEASE_TAG" "gt4r-${{ matrix.name }}.$ext" --clobber --repo "$GITHUB_REPOSITORY"
      # Other manual runs: an artifact.
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}.tar.gz
          if-no-files-found: error

  # The Android APK (android/README.md): the release build (arm64-v8a + x86_64), signed with the project's own key
  # (android/make-release-key.sh) from the repository secrets ANDROID_KEYSTORE_BASE64 (the .jks, base64) and
  # ANDROID_KEYSTORE_PASSWORD; the same key on every release, so installed copies update in place (docs/BUILDING.md,
  # "Making a release"). Without the secrets the job fails: a release never ships an unsigned or debug APK. The APK
  # is checked before it goes out: signed (apksigner), not debuggable, and its version the tag's.
  package-android:
    needs: [draft]
    if: >-
      !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'android')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # upload to the draft release
      id-token: write     # sign the APK's provenance attestation
      attestations: write
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      RELEASE_TAG: ${{ needs.draft.outputs.tag }} # (empty: not a release run)
    steps:
      - name: Package name
        run: |
          name="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          echo "PKG=gt4r-${name//\//-}-android" >> "$GITHUB_ENV"
      - name: Release key present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not both set: no APK (docs/BUILDING.md, Making a release: the one-time steps)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Gradle cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Fetch SDL
        run: android/fetch-sdl.sh
      - name: Build APK (release key)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GT4R_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/gt4r-release.jks"' EXIT # also when Gradle fails
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gt4r-release.jks"
          GT4R_KEYSTORE="$RUNNER_TEMP/gt4r-release.jks" ./gradlew --no-daemon assembleRelease
      # Signed (an unsigned build is app-release-unsigned.apk and has no app-release.apk), not debuggable, and on a
      # release run versionName = the tag's x.y.z (v0.1.0, v0.1.0-citest: 0.1.0), so the release's APK can't carry
      # another version's number.
      - name: Check APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::no signed $apk"; ls -l android/app/build/outputs/apk/release || true; exit 1; }
          bt=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1) # (the newest)
          "$bt/apksigner" verify --verbose --print-certs "$apk" | grep -v '^WARNING' | grep -v 'public key\|SHA-1\|MD5'
          badging=$("$bt/aapt2" dump badging "$apk")
          echo "$badging" | head -n 1
          if echo "$badging" | grep -q '^application-debuggable'; then echo "::error::$apk is debuggable"; exit 1; fi
          if [ -n "$RELEASE_TAG" ]; then
            want="${RELEASE_TAG#v}"; want="${want%%-*}"
            echo "$badging" | grep -q "versionName='$want'" || { echo "::error::the APK's versionName is not $want (the version in CMakeLists.txt)"; exit 1; }
          fi
          cp "$apk" "$PKG.apk"
          ls -l "$PKG.apk"; sha256sum "$PKG.apk"
      - uses: actions/attest-build-provenance@v2
        if: env.RELEASE_TAG != '' && github.event.repository.private == false
        with:
          subject-path: ${{ env.PKG }}.apk
      # Release runs: straight to the draft release, under the stable name gt4r-android.apk.
      - name: Upload to the draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PKG.apk" gt4r-android.apk
          gh release upload "$RELEASE_TAG" gt4r-android.apk --clobber --repo "$GITHUB_REPOSITORY"
      # Other manual runs: an artifact.
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.apk
          if-no-files-found: error

  # The Meta Quest APK (docs/VR.md, android/README.md "Meta Quest"): the same game as an immersive OpenXR app, on SDL's
  # development branch (fetch-sdl.sh --xr), arm64 only, signed with the phone APK's key and checked the same way, and
  # checked to be the headset's build (its manifest asks for head tracking). It has the phone app's application id and
  # key, so a newer release's Quest APK installs over the one on the headset. Without the secrets the job fails, as
  # package-android does.
  package-quest:
    needs: [draft]
    if: >-
      !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'android')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # upload to the draft release
      id-token: write     # sign the APK's provenance attestation
      attestations: write
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      RELEASE_TAG: ${{ needs.draft.outputs.tag }} # (empty: not a release run)
    steps:
      - name: Package name
        run: |
          name="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          echo "PKG=gt4r-${name//\//-}-quest" >> "$GITHUB_ENV"
      - name: Release key present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not both set: no Quest APK (docs/BUILDING.md, Making a release: the one-time steps)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Gradle cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Fetch SDL (development branch, OpenXR)
        run: android/fetch-sdl.sh --xr
      - name: Build Quest APK (release key)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GT4R_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/gt4r-release.jks"' EXIT # also when Gradle fails
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gt4r-release.jks"
          GT4R_KEYSTORE="$RUNNER_TEMP/gt4r-release.jks" ./gradlew --no-daemon assembleRelease -Pquest
      # As the phone APK's (signed, not debuggable, the tag's version), and the headset's: head tracking required, the
      # OpenXR loader in, arm64 only.
      - name: Check APK
        run: |
          apk=android/app/build/outputs/apk/release/app-quest-release.apk
          [ -f "$apk" ] || { echo "::error::no signed $apk"; ls -l android/app/build/outputs/apk/release || true; exit 1; }
          bt=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1) # (the newest)
          "$bt/apksigner" verify --verbose --print-certs "$apk" | grep -v '^WARNING' | grep -v 'public key\|SHA-1\|MD5'
          badging=$("$bt/aapt2" dump badging "$apk")
          echo "$badging" | head -n 1
          if echo "$badging" | grep -q '^application-debuggable'; then echo "::error::$apk is debuggable"; exit 1; fi
          if [ -n "$RELEASE_TAG" ]; then
            want="${RELEASE_TAG#v}"; want="${want%%-*}"
            echo "$badging" | grep -q "versionName='$want'" || { echo "::error::the APK's versionName is not $want (the version in CMakeLists.txt)"; exit 1; }
          fi
          echo "$badging" | grep -q "uses-feature: name='android.hardware.vr.headtracking'" || { echo "::error::$apk is not the headset's build (no head tracking feature)"; exit 1; }
          echo "$badging" | grep -q "^native-code: 'arm64-v8a'$" || { echo "::error::$apk is not arm64 only"; echo "$badging" | grep '^native-code'; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libopenxr_loader.so' || { echo "::error::no OpenXR loader in $apk"; exit 1; }
          cp "$apk" "$PKG.apk"
          ls -l "$PKG.apk"; sha256sum "$PKG.apk"
      - uses: actions/attest-build-provenance@v2
        if: env.RELEASE_TAG != '' && github.event.repository.private == false
        with:
          subject-path: ${{ env.PKG }}.apk
      # Release runs: straight to the draft release, under the stable name gt4r-quest.apk.
      - name: Upload to the draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PKG.apk" gt4r-quest.apk
          gh release upload "$RELEASE_TAG" gt4r-quest.apk --clobber --repo "$GITHUB_REPOSITORY"
      # Other manual runs: an artifact.
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.apk
          if-no-files-found: error

  # SHA256SUMS of the files the package jobs uploaded, and (public repository only) their
  # attestations. Re-run this job alone after the repository is made public to attest a release
  # made before: it checks the repository's visibility when it runs. A job that was not asked for
  # (a manual run for one platform) is skipped; any that failed stops it.
  release:
    needs: [draft, package, package-android, package-quest]
    if: >-
      !cancelled() && needs.draft.result == 'success' &&
      (needs.package.result == 'success' || needs.package.result == 'skipped') &&
      (needs.package-android.result == 'success' || needs.package-android.result == 'skipped') &&
      (needs.package-quest.result == 'success' || needs.package-quest.result == 'skipped') &&
      (needs.package.result == 'success' || needs.package-android.result == 'success' || needs.package-quest.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # upload to the release
      id-token: write     # sign the provenance attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checksums
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern 'gt4r-*'
          ls -l
          sha256sum gt4r-* > SHA256SUMS && cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
      - name: Repository visibility
        id: repo
        run: echo "private=$(gh api "repos/$GH_REPO" --jq .private)" | tee -a "$GITHUB_OUTPUT"
      # Anyone can check a download came from this workflow:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@v2
        if: steps.repo.outputs.private == 'false'
        with:
          subject-path: assets/gt4r-*
