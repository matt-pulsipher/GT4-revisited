name: build

on:
  # Branches build once, through their pull request; a push runs only for master and tags.
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # also builds the release packages
    inputs:
      platforms:
        description: "Which platforms' jobs run (all, or one: macos, linux, windows)"
        default: all
        type: choice
        options: [all, macos, linux, windows]

# A newer run of the same branch or tag cancels the one still running (Windows minutes count double).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Desktop: build the app, gt4tool and the unit tests on macOS, Linux and Windows and run the
# tests that need no disc image (the tests that read game data skip without GT4R_DISC).
#
# Needs: GitHub's hosted runners only; no secrets. The engine is the engine/gt3r submodule,
# fetched from its public repository, so the submodule commit must be pushed there. SDL 3.4.12,
# zlib and libchdr are fetched by CMake (engine/gt3r/cmake/Dependencies.cmake). Shaders are the
# engine's committed ones, so no shader tools are needed.
#
# Release packages (job `package`, on tags v* and manual runs) build SDL from source so they run
# without a system SDL, and hold no game data (cmake/Packaging.cmake). On a v* tag, job `release`
# collects them into a draft GitHub Release with SHA256SUMS and build provenance attestations,
# one file per platform under a stable name (gt4r-<platform>.<ext>), for
# .../releases/latest/download/<name>; review it, then publish. tools/release/package.sh makes
# the same macOS and Linux packages on a computer.

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'windows' && '["windows-2022"]' || inputs.platforms == 'macos' && '["macos-15"]' || inputs.platforms == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2022", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libxkbcommon-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build app, tools and tests
        run: cmake --build build --config Release --parallel 4 --target gt4r gt4tool gt4r_tests
      - name: Unit tests (no disc image)
        run: ctest --test-dir build -C Release --output-on-failure --verbose # (the tests run, skipped and failed, at the end)

  # ANGLE for the Windows package (packaging/angle.ps1, ~18 min), kept in the cache from master: a
  # tag's run restores only its own tag's caches and the default branch's. Built again when the
  # script or the triplets change; every other push just restores it, which also keeps it from
  # expiring (7 days unused).
  angle-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: ANGLE (cached)
        id: angle
        uses: actions/cache@v4
        with:
          path: angle
          key: angle-windows-${{ hashFiles('packaging/angle.ps1', 'packaging/vcpkg-triplets/**') }}
      - name: ANGLE
        if: steps.angle.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/angle.ps1

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # macos-15 / macos-arm64, windows-2022 / windows-x64, ubuntu-22.04 / linux-x86_64 (older glibc: runs on more
        # distributions); a manual run may take one of them.
        include: ${{ fromJSON(inputs.platforms == 'windows' && '[{"os":"windows-2022","name":"windows-x64"}]' || inputs.platforms == 'macos' && '[{"os":"macos-15","name":"macos-arm64"}]' || inputs.platforms == 'linux' && '[{"os":"ubuntu-22.04","name":"linux-x86_64"}]' || '[{"os":"macos-15","name":"macos-arm64"},{"os":"windows-2022","name":"windows-x64"},{"os":"ubuntu-22.04","name":"linux-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write     # sign this package's provenance attestation
      attestations: write
    steps:
      # gt4r-<tag>-<platform>; a branch's '/' made '-' (the name is a file's).
      - name: Package name
        shell: bash
        run: echo "PKG=gt4r-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libxkbcommon-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev zlib1g-dev g++-12
      # Windows: ANGLE (OpenGL ES on Direct3D 11) for the 3D renderer on GPUs without Vulkan
      # (packaging/angle.ps1); it ships next to gt4r.exe. Restored from the cache that job
      # angle-cache keeps, built here when the cache has none.
      - name: ANGLE (Windows, cached)
        id: angle
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: angle
          key: angle-windows-${{ hashFiles('packaging/angle.ps1', 'packaging/vcpkg-triplets/**') }}
      - name: ANGLE (Windows)
        if: runner.os == 'Windows' && steps.angle.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/angle.ps1
      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then extra="-DGT3R_SDL_SHARED=ON -DGT3R_ANGLE_DIR=$GITHUB_WORKSPACE/angle"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DGT4R_MAC_BUNDLE=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=arm64"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then extra="-DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGT3R_FETCH_SDL=ON -DGT4R_BUILD_TESTS=OFF $extra
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target gt4r gt4tool
      - name: Install
        run: cmake --install build --config Release --prefix "dist/${{ env.PKG }}"
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "dist/$PKG/gt4r.app"
          ditto -c -k --keepParent "dist/$PKG" "$PKG.zip"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PKG" -DestinationPath "$env:PKG.zip"
      # The packaged game started from its archive with no disc, muted, with a data folder of its own: a scripted run
      # (--shot) shows no window and saves a picture of the disc-choice page. Runners have no GPU with Vulkan: the
      # 3D renderer is ANGLE's OpenGL ES on Direct3D 11's software adapter.
      - name: Smoke run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force "$d\data" | Out-Null
          Expand-Archive "$env:PKG.zip" $d
          $env:GT4R_DATA_DIR = "$d\data"; $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process "$d\$env:PKG\gt4r.exe" -ArgumentList "--shot", "$d\no-disc.png", "--shot-frame", "60" -PassThru
          $null = $p.Handle # (keeps the exit code readable)
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Host "still running after 3 minutes" }
          Write-Host "exit code: $($p.ExitCode)"
          Get-ChildItem -Recurse "$d\data" | ForEach-Object { Write-Host "  $($_.FullName)" }
          Get-ChildItem "$d\data\*.log" | ForEach-Object { Get-Content $_ }
          if (-not (Test-Path "$d\no-disc.png")) { throw "no picture" }
          Copy-Item "$d\no-disc.png" "smoke-$env:PKG.png"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: smoke-${{ env.PKG }}
          path: smoke-${{ env.PKG }}.png
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "$PKG.tar.gz" "$PKG"
      # Attested where it was built. Tag runs only: manual runs are not releases.
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestations
      attestations: write
    steps:
      # Only this tag's packages (gt4r-<tag>-*).
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: gt4r-${{ github.ref_name }}-*
          merge-multiple: true
      # Renamed to stable names (the release itself carries the version), so
      # https://github.com/<owner>/<repo>/releases/latest/download/<name> always fetches the newest
      # package: gt4r-macos-arm64.zip, gt4r-windows-x64.zip, gt4r-linux-x86_64.tar.gz.
      - name: Stable names
        working-directory: assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for f in "gt4r-$TAG-"*; do mv "$f" "gt4r-${f#gt4r-$TAG-}"; done # one file per platform
          ls -l
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Anyone can check a download came from this workflow:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/gt4r-*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" \
            --draft --generate-notes --title "GT4 Revisited ${{ github.ref_name }}"
